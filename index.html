<!DOCTYPE html>
<html>
    <head>
        <title>Lab 2</title>

         <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
           integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
           crossorigin=""/>

         <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
           integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
           crossorigin=""></script>

    </head>

    <body>
        <div id="map" style="height: 500px"></div>

        <script type="text/javascript">

          var map = L.map('map', {
              center: [38.16, -96.96],
              zoom: 4
          });

          L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
               attribution: 'Tiles &copy; <a href="https://www.esri.com/">Esri</a>',
               maxZoom: 4,
               minZoom: 4
            }).addTo(map);
    var marker1 = L.marker([41.98,-87.72]).addTo(map); 
    var marker2 = L.marker([30.44,-84.3]).addTo(map);
    var marker3 = L.marker([40.76,-73.99]).addTo(map);
var pic1 = '<img src="images/willis.jpg" alt="Willis Tower" width="254">';
var pic2 = '<img src="images/disneyland.jpg" alt="Disneyland" width="331">';
var pic3 = '<img src="images/statueofliberty.jpg" alt="Statue of Liberty" width="165">';
var cameraIcon = L.icon({
    iconUrl: src="images/camera.png",  
    iconSize:     [38, 38], 
    iconAnchor:   [19, 19], 
    popupAnchor:  [0, -10] 
});
marker1.bindPopup('<p style="color:orange; font-weight:bold"> Willis Tower </p>' + pic1);
marker2.bindPopup('<p style="color:blue; font-weight:bold"> Disneyland</p>' + pic2);
marker3.bindPopup('<p style="color:red; font-weight:bold"> Statue of Liberty</p>' + pic3);
        </script>  
   </body>
</html>
